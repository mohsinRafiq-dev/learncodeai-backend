# Default compose stack.
#
# This file previously mounted /var/run/docker.sock into the app container and
# ran it with privileged: true. Together those grant host root — on a service
# whose whole purpose is executing untrusted student code, that turns any
# sandbox escape into full host compromise. Neither is present now.
#
# It also declared `depends_on: [docker]`, naming a service that does not exist
# in this file, which made `docker compose up` fail outright.
#
# The app no longer needs the Docker socket: executors run as their own
# services below, and the app talks to them over the network.
#
# For the hardened variant with per-executor capability dropping and read-only
# root filesystems, use docker-compose.secure.yml.

services:
  learncode-ai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - ./temp:/app/temp:rw
      - ./logs:/app/logs:rw
      - ./uploads:/app/uploads:rw
    environment:
      - NODE_ENV=production
      - CODE_EXEC_BACKEND=docker
      # Executor endpoints, resolved over the compose network.
      - PYTHON_EXECUTOR_URL=ws://python-executor:8765
      - JAVASCRIPT_EXECUTOR_URL=ws://javascript-executor:8765
      - CPP_EXECUTOR_URL=ws://cpp-executor:8765
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      - python-executor
      - javascript-executor
      - cpp-executor
    networks:
      - learncode-ai-network

  python-executor:
    build:
      context: ./docker
      dockerfile: Dockerfile.python.persistent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    mem_limit: 256m
    cpus: 0.3
    restart: unless-stopped
    networks:
      - learncode-ai-network

  javascript-executor:
    build:
      context: ./docker
      dockerfile: Dockerfile.javascript.persistent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=50m
    mem_limit: 256m
    cpus: 0.3
    restart: unless-stopped
    networks:
      - learncode-ai-network

  cpp-executor:
    build:
      context: ./docker
      dockerfile: Dockerfile.cpp.persistent
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # C++ compilation needs a writable working directory.
    read_only: false
    tmpfs:
      - /tmp:nosuid,size=100m
    mem_limit: 512m
    cpus: 0.5
    restart: unless-stopped
    networks:
      - learncode-ai-network

networks:
  learncode-ai-network:
    driver: bridge
